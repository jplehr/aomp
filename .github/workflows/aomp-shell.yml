name: AOMP shellcheck lint

on:
  pull_request:

jobs:
  aomp-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@22103cc46bda19c2b464ffe86db46df6922fd323
        with:
          separator: ' '
          skip_initial_fetch: true
          base_sha: 'HEAD~1'
          sha: 'HEAD'

      - name: Echo changed files
        run: |
          echo "Changed files: ${{ steps.changed-files.outputs.all_changed_files }}"

      - name: Run shellcheck
        run: |
          shellcheck_status=0
          # Read files into array safely
          IFS=$'\n' read -r -d '' -a files < <(echo "${{ steps.changed-files.outputs.all_changed_files }}" && printf '\0')

          for file in "${files[@]}"; do
            # Validate file path - reject suspicious patterns
            if [[ "$file" =~ \$\( ]] || [[ "$file" =~ \` ]] || [[ "$file" =~ \.\. ]]; then
              echo "ERROR: Suspicious filename detected: $file" >&2
              exit 1
            fi

            # Check if file exists and is a regular file
            if [[ ! -f "$file" ]]; then
              echo "WARNING: File not found or not a regular file: $file" >&2
              continue
            fi

            # Check file extension or type safely
            if [[ "$file" == *.sh ]] || file -- "$file" | grep -q "shell script"; then
              file_dir=$(dirname -- "$file")
              file_name=$(basename -- "$file")
              # Use printf instead of echo to avoid interpretation
              printf 'Running shellcheck on %s in directory %s\n' "$file" "$file_dir"
              # Use absolute path or validate directory
              if [[ ! -d "$file_dir" ]]; then
                echo "ERROR: Invalid directory: $file_dir" >&2
                exit 1
              fi
              pushd -- "$file_dir" > /dev/null || exit 1
              if ! shellcheck -x -- "$file_name"; then
                shellcheck_status=1
              fi
              popd > /dev/null || exit 1
            fi
          done
          exit "$shellcheck_status"
        shell: bash {0}
